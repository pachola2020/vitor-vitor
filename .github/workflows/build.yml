name: Build APK

on:
  push:
    branches: [assistant-foundation, main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de teste
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: PokeIdle-Assistant-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar release (somente main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assistant-${{ github.run_number }}
          name: PokeIdle Assistant ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
