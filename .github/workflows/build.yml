name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar os arquivos do app
        run: |
          mkdir -p app app/src/main app/src/main/java/com/duascontas/pokeidle
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PokeIdleDuasContas"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.duascontas.pokeidle"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.duascontas.pokeidle"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:label="PokeIdle 2 Contas"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Cada conta roda em um processo separado: assim os logins (cookies) ficam isolados -->
                  <service
                      android:name=".Conta1Service"
                      android:process=":conta1"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="janela_flutuante_de_jogo" />
                  </service>

                  <service
                      android:name=".Conta2Service"
                      android:process=":conta2"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="janela_flutuante_de_jogo" />
                  </service>

              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/duascontas/pokeidle/MainActivity.kt <<'EOF'
          package com.duascontas.pokeidle

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }

                  col.addView(text("PokeIdle - 2 Contas", 22f))
                  col.addView(text("Abre as duas contas em janelas flutuantes, com login separado.", 14f))

                  status = text("", 15f)
                  col.addView(status)

                  col.addView(text("PASSO 1 - Permissões (só na primeira vez)", 16f))
                  col.addView(button("1. Permitir exibir sobre outros apps") {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  })
                  col.addView(button("2. Permitir notificações") {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                      } else {
                          Toast.makeText(this, "Já está liberado neste Android", Toast.LENGTH_SHORT).show()
                      }
                  })
                  col.addView(button("3. Bateria: deixar sem restrições") {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  })
                  col.addView(
                      text(
                          "No POCO: Configurações > Apps > PokeIdle 2 Contas > Economia de bateria > " +
                              "\"Sem restrições\", e ative também \"Início automático\". " +
                              "Isso evita que o sistema feche o jogo em segundo plano.",
                          13f
                      )
                  )

                  col.addView(text("PASSO 2 - Abrir as janelas", 16f))
                  col.addView(button("Abrir as duas contas") {
                      start(Conta1Service::class.java)
                      start(Conta2Service::class.java)
                  })
                  col.addView(button("Abrir só a conta 1") { start(Conta1Service::class.java) })
                  col.addView(button("Abrir só a conta 2") { start(Conta2Service::class.java) })
                  col.addView(button("Fechar todas as janelas") {
                      stopService(Intent(this, Conta1Service::class.java))
                      stopService(Intent(this, Conta2Service::class.java))
                  })

                  col.addView(
                      text(
                          "Dicas: arraste pela barra de título para mover; use \"◢ tamanho\" para " +
                              "redimensionar. Para digitar (login), toque em ⌨ (fica verde), toque no campo, " +
                              "digite e toque em ⌨ de novo para soltar o teclado. ↻ recarrega, ✕ fecha.",
                          13f
                      )
                  )

                  val sv = ScrollView(this)
                  sv.addView(col)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (Settings.canDrawOverlays(this)) {
                      "✔ Exibir sobre outros apps: liberado"
                  } else {
                      "✖ Falta liberar \"Exibir sobre outros apps\" (botão 1)"
                  }
              }

              private fun start(cls: Class<*>) {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Antes, libere \"Exibir sobre outros apps\" (botão 1)", Toast.LENGTH_LONG).show()
                      return
                  }
                  startForegroundService(Intent(this, cls))
              }

              private fun text(t: String, size: Float): TextView = TextView(this).apply {
                  text = t
                  textSize = size
                  setPadding(0, 12, 0, 12)
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
              }

              private fun button(label: String, onClick: () -> Unit): Button = Button(this).apply {
                  text = label
                  isAllCaps = false
                  setOnClickListener { onClick() }
              }
          }
          EOF
          cat > app/src/main/java/com/duascontas/pokeidle/OverlayService.kt <<'EOF'
          package com.duascontas.pokeidle

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * Janela flutuante com o jogo. Cada conta usa uma subclasse (Conta1Service / Conta2Service)
           * que roda em processo próprio, com dados do navegador separados.
           */
          open class OverlayService : Service() {

              protected open val accountId: Int = 1

              companion object {
                  const val GAME_URL = "https://pokeidle.io/app"
                  const val ACTION_STOP = "com.duascontas.pokeidle.STOP"
                  private const val CHANNEL_ID = "janelas"
              }

              private var wm: WindowManager? = null
              private var root: LinearLayout? = null
              private var web: WebView? = null
              private var lp: WindowManager.LayoutParams? = null
              private var wake: PowerManager.WakeLock? = null
              private var typing = false
              private val handler = Handler(Looper.getMainLooper())

              private val flusher = object : Runnable {
                  override fun run() {
                      CookieManager.getInstance().flush()
                      handler.postDelayed(this, 15000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }

                  try {
                      WebView.setDataDirectorySuffix("conta$accountId")
                  } catch (e: Exception) {
                      // já definido neste processo; segue normalmente
                  }

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  buildWindow()

                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "pokeidle:conta$accountId").apply {
                      setReferenceCounted(false)
                      acquire()
                  }
                  handler.postDelayed(flusher, 15000)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  handler.removeCallbacks(flusher)
                  try {
                      CookieManager.getInstance().flush()
                  } catch (e: Exception) {
                  }
                  try {
                      root?.let { wm?.removeView(it) }
                  } catch (e: Exception) {
                  }
                  web?.let {
                      (it.parent as? ViewGroup)?.removeView(it)
                      it.destroy()
                  }
                  web = null
                  root = null
                  try {
                      wake?.let { if (it.isHeld) it.release() }
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "Janelas flutuantes", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopPi = PendingIntent.getService(
                      this,
                      accountId,
                      Intent(this, this::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val closeAction = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                      "Fechar",
                      stopPi
                  ).build()
                  val notif = Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("PokeIdle - Conta $accountId")
                      .setContentText("Janela flutuante ativa")
                      .setOngoing(true)
                      .addAction(closeAction)
                      .build()
                  val id = 100 + accountId
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(id, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(id, notif)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun buildWindow() {
                  val dm = resources.displayMetrics
                  val prefs = getSharedPreferences("janela$accountId", MODE_PRIVATE)
                  val portrait = dm.heightPixels >= dm.widthPixels

                  // Tamanho/posição padrão: em pé, uma conta em cima da outra; deitado, lado a lado.
                  val defW = if (portrait) dm.widthPixels else dm.widthPixels / 2
                  val defH = if (portrait) (dm.heightPixels * 0.30f).toInt() else (dm.heightPixels * 0.85f).toInt()
                  val defX = if (portrait) 0 else (accountId - 1) * defW
                  val defY = if (portrait) dp(40) + (accountId - 1) * defH else dp(8)

                  val w = prefs.getInt("w", defW).coerceIn(dp(160), dm.widthPixels)
                  val h = prefs.getInt("h", defH).coerceIn(dp(120), dm.heightPixels)
                  val x = prefs.getInt("x", defX).coerceIn(0, maxOf(0, dm.widthPixels - w))
                  val y = prefs.getInt("y", defY).coerceIn(0, maxOf(0, dm.heightPixels - h))

                  val params = WindowManager.LayoutParams(
                      w, h,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = x
                  params.y = y
                  params.softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN
                  lp = params

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                  }

                  // Barra de título (arraste por aqui)
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(0xFF263238.toInt())
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(36))
                  }
                  val title = TextView(this).apply {
                      text = "  ≡  Conta $accountId  (arraste aqui)"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                  }
                  val keyBtn = smallButton("⌨")
                  val reloadBtn = smallButton("↻")
                  val closeBtn = smallButton("✕")
                  bar.addView(title)
                  bar.addView(keyBtn)
                  bar.addView(reloadBtn)
                  bar.addView(closeBtn)

                  // WebView do jogo
                  val wv = WebView(this)
                  wv.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  wv.settings.javaScriptEnabled = true
                  wv.settings.domStorageEnabled = true
                  wv.settings.mediaPlaybackRequiresUserGesture = false
                  val cookies = CookieManager.getInstance()
                  cookies.setAcceptCookie(true)
                  cookies.setAcceptThirdPartyCookies(wv, true)
                  wv.webViewClient = WebViewClient()
                  wv.webChromeClient = WebChromeClient()
                  wv.loadUrl(GAME_URL)
                  web = wv

                  // Alça de redimensionar (canto inferior direito)
                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END
           setBackgroundColor(0xFF263238.toInt())
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(28))
                  }
                  val grip = TextView(this).apply {
                      text = "◢ tamanho"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setPadding(dp(12), 0, dp(12), 0)
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  }
                  bottom.addView(grip)

                  container.addView(bar)
                  container.addView(wv)
                  container.addView(bottom)
                  root = container

                  attachDrag(title, false)
                  attachDrag(grip, true)

                  keyBtn.setOnClickListener {
                      typing = !typing
                      val p = lp ?: return@setOnClickListener
                      p.flags = if (typing) {
                          p.flags and WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE.inv()
                      } else {
                          p.flags or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      }
                      keyBtn.setTextColor(if (typing) Color.GREEN else Color.WHITE)
                      wm?.updateViewLayout(container, p)
                      if (typing) wv.requestFocus()
                  }
                  reloadBtn.setOnClickListener { wv.reload() }
                  closeBtn.setOnClickListener { stopSelf() }

                  wm?.addView(container, params)
              }

              private fun smallButton(label: String): TextView = TextView(this).apply {
                  text = label
                  setTextColor(Color.WHITE)
                  textSize = 18f
                  gravity = Gravity.CENTER
                  layoutParams = LinearLayout.LayoutParams(dp(44), ViewGroup.LayoutParams.MATCH_PARENT)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun attachDrag(handle: View, resize: Boolean) {
                  var startA = 0
                  var startB = 0
                  var touchX = 0f
                  var touchY = 0f
                  handle.setOnTouchListener { _, e ->
                      val p = lp
                      val r = root
                      if (p == null || r == null) return@setOnTouchListener true
                      val dm = resources.displayMetrics
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              startA = if (resize) p.width else p.x
                              startB = if (resize) p.height else p.y
                              touchX = e.rawX
                              touchY = e.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (resize) {
                                  p.width = (startA + dx).coerceIn(dp(160), dm.widthPixels)
                                  p.height = (startB + dy).coerceIn(dp(120), dm.heightPixels)
                              } else {
                                  p.x = startA + dx
                                  p.y = startB + dy
                              }
                              wm?.updateViewLayout(r, p)
                          }
                          MotionEvent.ACTION_UP -> savePrefs()
                      }
                      true
                  }
              }

              private fun savePrefs() {
                  val p = lp ?: return
                  getSharedPreferences("janela$accountId", MODE_PRIVATE).edit()
                      .putInt("x", p.x)
                      .putInt("y", p.y)
                      .putInt("w", p.width)
                      .putInt("h", p.height)
                      .apply()
              }
          }

          class Conta1Service : OverlayService() {
              override val accountId: Int = 1
          }

          class Conta2Service : OverlayService() {
              override val accountId: Int = 2
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeIdle-2-Contas-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: PokeIdle 2 Contas (versao ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
