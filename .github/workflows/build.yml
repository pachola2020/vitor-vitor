name: Build APK

on:
  push:
    branches: [assistant-foundation, assistant-analysis-foundation, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokeidle-assistant-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Mantém a mesma chave de assinatura entre builds de teste para permitir
      # atualização por cima sem desinstalar o Assistant.
      - name: Restaurar assinatura estável de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pokeidle-assistant-debug-signing-v1

      - name: Criar assinatura de teste se necessário
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=PokeIdle Assistant,C=BR"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de teste
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: PokeIdle-Assistant-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar APK com nome estável
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PokeIdle-Assistant.apk

      - name: Publicar atualização de teste no GitHub Releases
        if: github.ref == 'refs/heads/assistant-analysis-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\\1/' | sed 's/-analysis-test$//')
          TAG="assistant-v${VERSION_NAME}"
          gh release create "$TAG" app/build/outputs/apk/debug/PokeIdle-Assistant.apk \
            --title "PokeIdle Assistant ${VERSION_NAME}" \
            --notes "Versão de teste do PokeIdle Assistant. Instalação iniciada pelo botão Verificar atualização no app; o Android ainda solicitará confirmação." \
            --prerelease --target "$GITHUB_SHA"

      - name: Publicar release (somente main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assistant-${{ github.run_number }}
          name: PokeIdle Assistant ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
