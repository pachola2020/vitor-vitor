name: Build APK

on:
  push:
    branches: [assistant-foundation, assistant-analysis-foundation, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokeidle-assistant-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Mantém a mesma chave de assinatura entre builds de teste para permitir
      # atualização por cima sem desinstalar o Assistant.
      - name: Restaurar assinatura estável de teste
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pokeidle-assistant-debug-signing-v1

      - name: Exigir a assinatura persistida
        run: |
          if [ "${{ steps.signing-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Cache da assinatura não encontrado. Não gerar outra chave automaticamente."
            exit 1
          fi
          test -f "$HOME/.android/debug.keystore"
          KEY_CERT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT="21ceceb1e6f17c393a4406b235c7860eddc56187b43e5a60dbb0f216378e23cb"
          echo "Keystore SHA-256: $KEY_CERT"
          if [ "$KEY_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::A assinatura persistida mudou. Build bloqueado para evitar APK incompatível."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de teste
        run: gradle :app:signingReport testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Conferir certificado efetivo do APK
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner não encontrado no SDK"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          KEY_CERT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$KEY_CERT" != "$APK_CERT" ]; then
            echo "::error::O APK não foi assinado pela keystore persistida."
            echo "Keystore: $KEY_CERT"
            echo "APK: $APK_CERT"
            exit 1
          fi
          echo "Assinatura confirmada: $APK_CERT"

      - name: Guardar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: PokeIdle-Assistant-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar APK com nome estável
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PokeIdle-Assistant.apk

      - name: Publicar atualização de teste no GitHub Releases
        if: github.ref == 'refs/heads/assistant-analysis-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/-analysis-test$//')
          TAG="assistant-v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; preservando o APK publicado e pulando a criação."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/PokeIdle-Assistant.apk \
              --title "PokeIdle Assistant ${VERSION_NAME}" \
              --notes "Migração segura do PokeIdle Assistant: instalada como aplicativo paralelo para preservar a instalação e os dados da versão anterior. Faça login novamente nesta nova instalação. Atualizações futuras usam assinatura persistente verificada no CI." \
              --prerelease --target "$GITHUB_SHA"
          fi

      - name: Publicar release (somente main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assistant-${{ github.run_number }}
          name: PokeIdle Assistant ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
